[package]
name = "miagendaapp"
version = "1.0.4"
description = "Agenda y editor de notas de escritorio, 100 % local."
authors = ["Cristian Luque Domínguez"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "miagendaapp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled", "cache", "backup"], default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
uuid = { version = "1.29.0", default-features = false, features = ["v7", "std"] }
tauri-plugin-notification = "2"
tokio = { version = "1", default-features = false, features = ["sync", "time", "macros", "rt"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"

[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.8.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"
